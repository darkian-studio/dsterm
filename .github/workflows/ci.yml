name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Coverage instrumentation (FIXLIST #85): cargo-llvm-cov runs the
      # same suite as a plain cargo test, compiled with llvm source-based
      # coverage, and emits an lcov report kept as a run artifact.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  test-zim:
    name: Test with zim feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests with zim feature
        run: cargo test --features zim

  build-llama:
    name: Build & test with llama feature
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Build with llama feature
        run: cargo build --features llama

      - name: Test with llama feature
        run: cargo test --features llama

  # FIXLIST #95: the suite had no Windows job, so `pty_fallback`,
  # `shell_integration`'s OSC 633 path, the ConPTY handlers and the
  # platform-gated transfer asserts were never compiled or run. Windows is a
  # supported release target (release.yml builds x86_64-pc-windows-msvc), so
  # its code paths need a test run of their own. `llama` is excluded: it
  # compiles a vendored C++ tree and needs CMake + a C++17 toolchain, which is
  # the build-cost reason dsterm's own AGENTS.md forbids it on Windows hosts.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test

  # The zim reader is pure Rust, so the same feature-gated suite the Linux job
  # runs also covers the Windows build of the archive surface.
  test-zim-windows:
    name: Test with zim feature (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests with zim feature
        run: cargo test --features zim

