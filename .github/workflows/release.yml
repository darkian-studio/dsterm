name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.os_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Android (Termux) native binaries
          - os_name: Android-aarch64
            target: aarch64-linux-android
            binary_name: dsterm-android-arm64
          - os_name: Android-armv7
            target: armv7-linux-androideabi
            binary_name: dsterm-android-armv7
          - os_name: Android-x86_64
            target: x86_64-linux-android
            binary_name: dsterm-android-x86_64
          # Linux musl static binaries (run on any Linux distro)
          - os_name: Linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            binary_name: dsterm-linux-arm64
          - os_name: Linux-armv7-musl
            target: armv7-unknown-linux-musleabihf
            binary_name: dsterm-linux-armv7
          - os_name: Linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            binary_name: dsterm-linux-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git --branch main

      - name: Add Rust target
        run: rustup target add ${{ matrix.platform.target }}

      - name: Build binary with cross
        run: cross build --release --features llama --target ${{ matrix.platform.target }}

      - name: Rename binary
        run: mv target/${{ matrix.platform.target }}/release/dsterm target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}

      - name: Generate SHA-256
        run: |
          cd target/${{ matrix.platform.target }}/release
          sha256sum ${{ matrix.platform.binary_name }} > ${{ matrix.platform.binary_name }}.sha256

      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}
            target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}.sha256

  build-macos:
    name: Build ${{ matrix.platform.os_name }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os_name: macOS-arm64
            target: aarch64-apple-darwin
            binary_name: dsterm-macos-arm64
          - os_name: macOS-x86_64
            target: x86_64-apple-darwin
            binary_name: dsterm-macos-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add Rust target
        run: rustup target add ${{ matrix.platform.target }}

      - name: Build binary
        run: cargo build --release --features llama --target ${{ matrix.platform.target }}

      - name: Rename binary
        run: mv target/${{ matrix.platform.target }}/release/dsterm target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}

      - name: Generate SHA-256
        run: |
          cd target/${{ matrix.platform.target }}/release
          shasum -a 256 ${{ matrix.platform.binary_name }} > ${{ matrix.platform.binary_name }}.sha256

      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}
            target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary_name }}.sha256

  build-windows:
    name: Build Windows-x86_64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Add Rust target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build binary
        run: cargo build --release --features llama --target x86_64-pc-windows-msvc

      - name: Rename binary
        run: Move-Item target/x86_64-pc-windows-msvc/release/dsterm.exe target/x86_64-pc-windows-msvc/release/dsterm-windows-x86_64.exe

      - name: Generate SHA-256
        run: |
          $file = "target/x86_64-pc-windows-msvc/release/dsterm-windows-x86_64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  dsterm-windows-x86_64.exe" | Out-File -Encoding ascii "$file.sha256"

      - name: Upload artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/x86_64-pc-windows-msvc/release/dsterm-windows-x86_64.exe
            target/x86_64-pc-windows-msvc/release/dsterm-windows-x86_64.exe.sha256
